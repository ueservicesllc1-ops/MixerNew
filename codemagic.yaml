workflows:
  ios-appstore-workflow:
    name: Publish to App Store Connect & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods Dependencies
        script: |
          set -e
          cd ios/App
          pod install

      - name: Fetch or create signing files
        script: |
          chmod 600 $CM_BUILD_DIR/ios/appstore_cert_key.pem
          app-store-connect fetch-signing-files "com.zionstagelive.app.NJ5K877659" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:$CM_BUILD_DIR/ios/appstore_cert_key.pem

      - name: Set up keychain and code signing
        script: |
          keychain initialize
          keychain add-certificates
          NEW_BUILD=$((${BUILD_NUMBER:-1} + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${NEW_BUILD};/g" ios/App/App.xcodeproj/project.pbxproj
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build Signed IPA for App Store
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
